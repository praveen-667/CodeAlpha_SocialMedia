<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CodeAlpha Social</title>


    <!-- GOOGLE FONT -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: 'Poppins', Arial, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                    linear-gradient(
                            135deg,
                            #6c3cff,
                            #9b4dff,
                            #ff4f9a,
                            #ff7eb3
                    );

            overflow-x: hidden;

            position: relative;

            padding: 30px 0;
        }


        /* =========================
           ANIMATED BACKGROUND
           ========================= */

        .shape {

            position: absolute;

            border-radius: 50%;

            background:
                    rgba(255,255,255,0.13);

            animation:
                    floating 8s ease-in-out infinite;
        }


        .shape-one {

            width: 280px;

            height: 280px;

            top: -100px;

            left: -80px;
        }


        .shape-two {

            width: 350px;

            height: 350px;

            right: -130px;

            bottom: -130px;

            animation-delay: 2s;
        }


        .shape-three {

            width: 150px;

            height: 150px;

            left: 12%;

            bottom: 15%;

            background:
                    rgba(255,230,109,0.18);

            animation-delay: 4s;
        }


        .shape-four {

            width: 110px;

            height: 110px;

            right: 18%;

            top: 12%;

            background:
                    rgba(72,220,181,0.18);

            animation-delay: 1s;
        }


        @keyframes floating {

            0%, 100% {

                transform:
                        translateY(0)
                        translateX(0)
                        rotate(0deg);

            }

            50% {

                transform:
                        translateY(-30px)
                        translateX(20px)
                        rotate(10deg);

            }

        }


        /* =========================
           REGISTER CARD
           ========================= */

        .register-card {

            position: relative;

            z-index: 5;

            width: 92%;

            max-width: 460px;

            padding: 35px;

            background:
                    rgba(255,255,255,0.96);

            backdrop-filter: blur(15px);

            border-radius: 25px;

            box-shadow:
                    0 25px 60px
                    rgba(40,20,90,0.30);

            animation:
                    cardAppear 0.8s ease;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                        translateY(35px)
                        scale(0.95);

            }

            to {

                opacity: 1;

                transform:
                        translateY(0)
                        scale(1);

            }

        }


        /* =========================
           ICON
           ========================= */

        .register-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            background:
                    linear-gradient(
                            135deg,
                            #6c3cff,
                            #ff4f9a
                    );

            box-shadow:
                    0 8px 20px
                    rgba(108,60,255,0.25);

            animation:
                    iconPulse 3s ease-in-out infinite;
        }


        @keyframes iconPulse {

            0%, 100% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.07);

            }

        }


        /* =========================
           LOGO
           ========================= */

        .logo {

            text-align: center;

            font-size: 27px;

            font-weight: 700;

            color: #30205e;

            margin-bottom: 5px;
        }


        .logo span {

            color: #ff4f9a;
        }


        .tagline {

            text-align: center;

            color: #888;

            font-size: 13px;

            margin-bottom: 25px;
        }


        /* =========================
           ERROR MESSAGE
           ========================= */

        .error {

            background: #fff0f2;

            color: #d9304f;

            border:
                    1px solid #ffd0d8;

            padding: 11px;

            border-radius: 10px;

            margin-bottom: 15px;

            text-align: center;

            font-size: 13px;
        }


        /* =========================
           FORM
           ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #45306e;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 13px;

            top: 50%;

            transform:
                    translateY(-50%);

            font-size: 17px;
        }


        input {

            width: 100%;

            padding:
                    13px 13px 13px 43px;

            border:
                    2px solid #eee;

            border-radius: 12px;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            background: #fafaff;

            transition:
                    border-color 0.3s,
                    box-shadow 0.3s,
                    background 0.3s;
        }


        input:focus {

            border-color: #8b5cf6;

            background: white;

            box-shadow:
                    0 0 0 4px
                    rgba(139,92,246,0.10);
        }


        /* =========================
           PASSWORD STRENGTH
           ========================= */

        .password-hint {

            margin-top: 6px;

            color: #999;

            font-size: 10px;
        }


        /* =========================
           REGISTER BUTTON
           ========================= */

        .register-button {

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            background:
                    linear-gradient(
                            135deg,
                            #6c3cff,
                            #ff4f9a
                    );

            box-shadow:
                    0 7px 20px
                    rgba(108,60,255,0.25);

            transition:
                    transform 0.3s,
                    box-shadow 0.3s;
        }


        .register-button:hover {

            transform:
                    translateY(-3px);

            box-shadow:
                    0 11px 25px
                    rgba(108,60,255,0.35);
        }


        .register-button:active {

            transform:
                    scale(0.97);
        }


        /* =========================
           LINKS
           ========================= */

        .links {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #777;
        }


        .links a {

            color: #7041d9;

            text-decoration: none;

            font-weight: 600;

            transition: 0.2s;
        }


        .links a:hover {

            color: #ff4f9a;

            text-decoration: underline;
        }


        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 18px 0;

            color: #aaa;

            font-size: 11px;
        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            background: #eee;

            flex: 1;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 500px) {

            body {

                padding: 20px 0;

            }


            .register-card {

                padding:
                        27px 22px;

            }


            .logo {

                font-size: 23px;

            }


            .register-icon {

                width: 60px;

                height: 60px;

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     BACKGROUND SHAPES
     ========================= -->

<div class="shape shape-one"></div>

<div class="shape shape-two"></div>

<div class="shape shape-three"></div>

<div class="shape shape-four"></div>


<!-- =========================
     REGISTER CARD
     ========================= -->

<div class="register-card">


    <!-- ICON -->

    <div class="register-icon">

        ✨

    </div>


    <!-- LOGO -->

    <div class="logo">

        ✦ CodeAlpha <span>Social</span>

    </div>


    <div class="tagline">

        Create your account and join the community 💜

    </div>


    <!-- ERROR -->

    <div class="error"
         th:if="${error != null}"
         th:text="${error}">

        Email already registered

    </div>


    <!-- REGISTER FORM -->

    <form action="/register"
          method="post">


        <!-- NAME -->

        <div class="form-group">

            <label>
                Full Name
            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>


                <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required>

            </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email Address
            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    📧
                </span>


                <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    🔑
                </span>


                <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

            </div>


            <div class="password-hint">

                🔒 Password should contain at least 6 characters.

            </div>

        </div>


        <!-- BUTTON -->

        <button type="submit"
                class="register-button">

            🚀 Create Account

        </button>

    </form>


    <!-- LINKS -->

    <div class="links">


        <p>

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


        <div class="divider">
            OR
        </div>


        <p>

            <a href="/">
                ← Back to Home
            </a>

        </p>

    </div>

</div>


</body>

</html>
